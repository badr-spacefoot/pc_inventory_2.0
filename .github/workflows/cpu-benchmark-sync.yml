name: Sync CPU benchmark scores

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync CPU benchmarks
        env:
          API_URL: ${{ vars.IT_INVENTORY_API_URL }}
          SYNC_TOKEN: ${{ secrets.CPU_BENCHMARK_SYNC_TOKEN }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Missing repository variable IT_INVENTORY_API_URL"
            exit 1
          fi
          if [ -z "$SYNC_TOKEN" ]; then
            echo "Missing repository secret CPU_BENCHMARK_SYNC_TOKEN"
            exit 1
          fi
          curl --fail --show-error --silent \
            --request POST "$API_URL/admin/cpu-benchmarks/sync" \
            --header "content-type: application/json" \
            --header "x-cpu-benchmark-sync-token: $SYNC_TOKEN" \
            --data '{"limit":250,"recalculate":true,"recalculateLimit":120}'
