name: Collector published binary GUI acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/collector-binary-acceptance.yml
      - .github/workflows/collector-production-acceptance.yml
      - tools/collector-binary-acceptance.py
      - tools/collector-native-ui.swift
      - tools/collector-release-acceptance.py

permissions:
  contents: read

jobs:
  published-binary:
    name: Native GUI 0.1.58 / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Prepare Linux GUI and verified osquery
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick tesseract-ocr
          python scripts/download-osquery.py linux
          dpkg-deb -x installer-assets/osquery.deb "$RUNNER_TEMP/acceptance-osquery"
      - name: Exercise published executable through external GUI input
        env:
          PARCEO_ACCEPTANCE_ROOT: ${{ runner.temp }}/parceo-binary-acceptance
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1600x1200x24' python tools/collector-binary-acceptance.py
          else
            python tools/collector-binary-acceptance.py
          fi
      - name: Keep binary GUI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collector-binary-acceptance-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/parceo-binary-acceptance/result.json
            ${{ runner.temp }}/parceo-binary-acceptance/binary-success.png
          if-no-files-found: warn
          retention-days: 14
