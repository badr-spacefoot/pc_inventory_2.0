name: Build collector apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            artifact: spacefoot-it-collector-windows
            separator: ;
          - name: macos
            os: macos-latest
            artifact: spacefoot-it-collector-macos
            separator: ":"
          - name: linux
            os: ubuntu-latest
            artifact: spacefoot-it-collector-linux
            separator: ":"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build collector
        run: >
          pyinstaller
          --onefile
          --windowed
          --name "${{ matrix.artifact }}"
          --add-data "scripts/collect-cross-platform.py${{ matrix.separator }}scripts"
          collectors/desktop_collector/collector_app.py

      - name: Upload collector artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}*
