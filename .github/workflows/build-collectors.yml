name: Build collector apps

on:
  workflow_dispatch:
  push:
    tags:
      - "collector-v*"
      - "collector-manual-v*"

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  source:
    needs: quality
    name: Inspectable source collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Configure manual unsigned release
        if: startsWith(github.ref, 'refs/tags/collector-manual-v')
        run: python scripts/configure-manual-collector.py
      - name: Package allowlisted collector source
        run: python scripts/package-collector-source.py --output dist/collector-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collector-source-internal-validation
          path: dist/collector-source.zip
          if-no-files-found: error
  build:
    needs: quality
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            artifact: spacefoot-it-collector-windows
            separator: ;
            pyinstaller_mode: --onedir
            pyinstaller_icon: --icon frontend/assets/brand/app-icon.ico
            pyinstaller_bundle_id: ""
            pyinstaller_extra: ""
          - name: macos
            # Build the default macOS package for Intel. The x86_64 app runs
            # natively on Intel Macs and through Rosetta on Apple Silicon,
            # which gives one download the broadest hardware coverage.
            os: macos-15-intel
            artifact: spacefoot-it-collector-macos
            separator: ":"
            # A standard onedir .app avoids the temporary onefile extraction
            # process that can terminate silently on older supported Macs.
            pyinstaller_mode: --onedir
            pyinstaller_icon: --icon build/app-icon.icns
            pyinstaller_bundle_id: "--osx-bundle-identifier com.spacefoot.itcollector"
            pyinstaller_extra: "--argv-emulation --target-arch x86_64"
            macos_deployment_target: "13.0"
          - name: linux
            os: ubuntu-22.04
            artifact: spacefoot-it-collector-linux
            separator: ":"
            pyinstaller_mode: --onefile
            pyinstaller_icon: ""
            pyinstaller_bundle_id: ""
            pyinstaller_extra: ""

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --require-hashes -r collectors/requirements-build.lock

      - name: Configure manual unsigned release
        if: startsWith(github.ref, 'refs/tags/collector-manual-v')
        run: python scripts/configure-manual-collector.py

      - name: Require production release trust
        if: startsWith(github.ref, 'refs/tags/collector-v')
        shell: bash
        env:
          COLLECTOR_UPDATE_PUBLIC_KEY: ${{ vars.COLLECTOR_UPDATE_PUBLIC_KEY }}
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          WINDOWS_PUBLISHER_THUMBPRINT: ${{ vars.WINDOWS_PUBLISHER_THUMBPRINT }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in COLLECTOR_UPDATE_PUBLIC_KEY WINDOWS_CODESIGN_PFX_BASE64 WINDOWS_CODESIGN_PASSWORD WINDOWS_PUBLISHER_THUMBPRINT MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_CODESIGN_IDENTITY MACOS_NOTARY_APPLE_ID MACOS_NOTARY_TEAM_ID MACOS_NOTARY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Production release requires $name"; exit 1; fi
          done
          python scripts/prepare-collector-release.py configure

      - name: Prepare bundled tools directory
        shell: bash
        run: mkdir -p installer-assets/bundled-tools

      - name: Bundle osquery for Linux
        if: matrix.name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download-osquery.py linux
          mkdir -p installer-assets/osquery-root
          dpkg-deb -x installer-assets/osquery.deb installer-assets/osquery-root
          osqueryi_path="$(find installer-assets/osquery-root -name osqueryi | head -n 1)"
          if [ -z "$osqueryi_path" ]; then
            echo "osqueryi was not found inside the downloaded osquery package."
            exit 1
          fi
          resolved_osqueryi_path="$osqueryi_path"
          if [ -L "$osqueryi_path" ]; then
            osqueryi_target="$(readlink "$osqueryi_path")"
            if [[ "$osqueryi_target" = /* ]]; then
              resolved_osqueryi_path="installer-assets/osquery-root${osqueryi_target}"
            else
              resolved_osqueryi_path="$(dirname "$osqueryi_path")/${osqueryi_target}"
            fi
          fi
          if [ ! -e "$resolved_osqueryi_path" ]; then
            echo "Resolved osqueryi target was not found: $resolved_osqueryi_path"
            exit 1
          fi
          if [ -d installer-assets/osquery-root/opt/osquery ]; then
            cp -a installer-assets/osquery-root/opt/osquery installer-assets/bundled-tools/osquery
            find installer-assets/bundled-tools/osquery -name osqueryi -exec chmod +x {} \;
          else
            cp "$resolved_osqueryi_path" installer-assets/bundled-tools/osqueryi
            chmod +x installer-assets/bundled-tools/osqueryi
          fi
          cp "$resolved_osqueryi_path" installer-assets/bundled-tools/osqueryi
          chmod +x installer-assets/bundled-tools/osqueryi

      - name: Bundle osquery for macOS
        if: matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download-osquery.py macos
          pkgutil --check-signature installer-assets/osquery.pkg
          pkgutil --expand-full installer-assets/osquery.pkg installer-assets/osquery-root
          osqueryi_path="$(find installer-assets/osquery-root -name osqueryi -type f | head -n 1)"
          test -n "$osqueryi_path"
          cp "$osqueryi_path" installer-assets/bundled-tools/osqueryi
          chmod +x installer-assets/bundled-tools/osqueryi

      - name: Prepare macOS app icon
        if: matrix.name == 'macos'
        shell: bash
        run: |
          mkdir -p build/app-icon.iconset
          sips -z 16 16 frontend/assets/brand/parceo/collector-square-1024.png --out build/app-icon.iconset/icon_16x16.png
          sips -z 32 32 frontend/assets/brand/parceo/collector-square-1024.png --out build/app-icon.iconset/icon_16x16@2x.png
          sips -z 32 32 frontend/assets/brand/parceo/collector-square-1024.png --out build/app-icon.iconset/icon_32x32.png
          sips -z 64 64 frontend/assets/brand/parceo/collector-square-1024.png --out build/app-icon.iconset/icon_32x32@2x.png
          sips -z 128 128 frontend/assets/brand/parceo/collector-square-1024.png --out build/app-icon.iconset/icon_128x128.png
          sips -z 256 256 frontend/assets/brand/parceo/collector-square-1024.png --out build/app-icon.iconset/icon_128x128@2x.png
          sips -z 256 256 frontend/assets/brand/parceo/collector-square-1024.png --out build/app-icon.iconset/icon_256x256.png
          sips -z 512 512 frontend/assets/brand/parceo/collector-square-1024.png --out build/app-icon.iconset/icon_256x256@2x.png
          sips -z 512 512 frontend/assets/brand/parceo/collector-square-1024.png --out build/app-icon.iconset/icon_512x512.png
          sips -z 1024 1024 frontend/assets/brand/parceo/collector-square-1024.png --out build/app-icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/app-icon.iconset -o build/app-icon.icns

      - name: Build collector
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: >
          pyinstaller
          --noupx
          ${{ matrix.pyinstaller_mode }}
          --windowed
          --name "${{ matrix.artifact }}"
          ${{ matrix.pyinstaller_icon }}
          ${{ matrix.pyinstaller_bundle_id }}
          ${{ matrix.pyinstaller_extra }}
          --paths "collectors/desktop_collector"
          --add-data "scripts/collect-cross-platform.py${{ matrix.separator }}scripts"
          --add-data "frontend/assets/brand${{ matrix.separator }}assets/brand"
          --add-data "installer-assets/bundled-tools${{ matrix.separator }}bundled-tools"
          --hidden-import argparse
          --hidden-import certifi
          --hidden-import cryptography.hazmat.primitives.asymmetric.ed25519
          --hidden-import ctypes
          --hidden-import datetime
          --hidden-import diagnostics
          --hidden-import update_security
          --hidden-import getpass
          --hidden-import os
          --hidden-import platform
          --hidden-import re
          --hidden-import shutil
          --hidden-import socket
          --hidden-import subprocess
          --hidden-import urllib.error
          --hidden-import urllib.request
          --hidden-import uuid
          --hidden-import winreg
          collectors/desktop_collector/collector_app.py

      - name: Probe Windows collector without hardware scanning
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          SPACEFOOT_COLLECTOR_STARTUP_PROBE: "1"
        run: |
          $process = Start-Process -FilePath dist/spacefoot-it-collector-windows/spacefoot-it-collector-windows.exe -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Collector startup probe failed" }

      - name: Probe Linux collector without hardware scanning
        if: matrix.name == 'linux'
        env:
          SPACEFOOT_COLLECTOR_STARTUP_PROBE: "1"
        run: xvfb-run -a dist/spacefoot-it-collector-linux

      - name: Register macOS URL scheme
        if: matrix.name == 'macos'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import plistlib

          plist_path = Path("dist/spacefoot-it-collector-macos.app/Contents/Info.plist")
          if not plist_path.exists():
              raise SystemExit(f"macOS app Info.plist not found: {plist_path}")

          with plist_path.open("rb") as handle:
              plist = plistlib.load(handle)

          plist["CFBundleIdentifier"] = "com.spacefoot.itcollector"
          plist["CFBundleName"] = "Parcéo Collector"
          plist["CFBundleDisplayName"] = "Parcéo Collector"
          plist["LSMinimumSystemVersion"] = "13.0"
          plist["CFBundleURLTypes"] = [
              entry
              for entry in plist.get("CFBundleURLTypes", [])
              if "spacefoot-collector" not in entry.get("CFBundleURLSchemes", [])
          ]
          plist["CFBundleURLTypes"].append({
              "CFBundleTypeRole": "Viewer",
              "CFBundleURLName": "com.spacefoot.itcollector",
              "CFBundleURLSchemes": ["spacefoot-collector"],
          })

          with plist_path.open("wb") as handle:
              plistlib.dump(plist, handle)
          PY

      - name: Verify macOS compatibility
        if: matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          app="dist/${{ matrix.artifact }}.app"
          executable="$app/Contents/MacOS/${{ matrix.artifact }}"
          if [ ! -x "$executable" ]; then
            echo "The macOS app executable is missing or is not executable: $executable"
            exit 1
          fi
          architectures="$(lipo -archs "$executable")"
          minimum_version="$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")"
          echo "Collector architectures: $architectures"
          echo "Minimum macOS version: $minimum_version"
          if [[ " $architectures " != *" x86_64 "* ]]; then
            echo "The default macOS package must include the x86_64 architecture."
            exit 1
          fi
          if [ "$minimum_version" != "13.0" ]; then
            echo "Unexpected minimum macOS version: $minimum_version"
            exit 1
          fi
          SPACEFOOT_COLLECTOR_STARTUP_PROBE=1 "$executable"
          echo "Collector startup probe completed successfully."

      - name: Sign Windows collector
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CODESIGN_PFX_BASE64) {
            if ($env:GITHUB_REF -like 'refs/tags/collector-v*') { throw "Production signing certificate required" }
            Write-Host "Unsigned internal validation build; not a production installer."
            exit 0
          }
          $target = "dist/${{ matrix.artifact }}/${{ matrix.artifact }}.exe"
          if (-not (Test-Path $target)) {
            $target = "dist/${{ matrix.artifact }}.exe"
          }
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) {
            throw "signtool.exe not found in Windows SDK."
          }
          if ($env:WINDOWS_CODESIGN_PFX_BASE64) {
            $certPath = Join-Path $env:RUNNER_TEMP "spacefoot-codesign.pfx"
            try {
              [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
              & $signTool sign /f $certPath /p $env:WINDOWS_CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $target
              if ($LASTEXITCODE -ne 0) { throw "Windows signing failed" }
            } finally {
              Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Download and verify osquery Windows MSI
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          python scripts/download-osquery.py windows
          if ($LASTEXITCODE -ne 0) { throw "osquery download failed" }
          $signature = Get-AuthenticodeSignature installer-assets/osquery.msi
          if ($signature.Status -ne 'Valid') { throw "osquery signature is not valid" }

      - name: Install Inno Setup
        if: matrix.name == 'windows'
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^collector-(?:manual-)?v[0-9]+\.[0-9]+\.[0-9]+$') {
            $env:GITHUB_REF_NAME -replace '^collector-(?:manual-)?v', ''
          } else {
            "0.0.0-dev"
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc."
          }
          & $iscc "installer/windows/spacefoot-collector.iss" "/DAppVersion=$version"

      - name: Sign Windows installer
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CODESIGN_PFX_BASE64) {
            if ($env:GITHUB_REF -like 'refs/tags/collector-v*') { throw "Production signing certificate required" }
            Write-Host "Unsigned internal validation installer; not a production release."
            exit 0
          }
          $version = if ($env:GITHUB_REF_NAME -match '^collector-(?:manual-)?v[0-9]+\.[0-9]+\.[0-9]+$') {
            $env:GITHUB_REF_NAME -replace '^collector-(?:manual-)?v', ''
          } else {
            "0.0.0-dev"
          }
          $target = "dist/installer/Spacefoot-IT-Collector-$version-Setup.exe"
          if (-not (Test-Path $target)) {
            throw "Installer was not found at $target."
          }
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) {
            throw "signtool.exe not found in Windows SDK."
          }
          if ($env:WINDOWS_CODESIGN_PFX_BASE64) {
            $certPath = Join-Path $env:RUNNER_TEMP "spacefoot-codesign.pfx"
            try {
              [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
              & $signTool sign /f $certPath /p $env:WINDOWS_CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $target
              if ($LASTEXITCODE -ne 0) { throw "Windows installer signing failed" }
            } finally {
              Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Verify final Windows production signatures
        if: matrix.name == 'windows' && startsWith(github.ref, 'refs/tags/collector-v')
        shell: pwsh
        env:
          WINDOWS_PUBLISHER_THUMBPRINT: ${{ vars.WINDOWS_PUBLISHER_THUMBPRINT }}
        run: |
          $targets = @(Get-ChildItem dist/installer/*Setup.exe) + @(Get-Item dist/spacefoot-it-collector-windows/spacefoot-it-collector-windows.exe)
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_PUBLISHER_THUMBPRINT) { throw "Untrusted release signature" }
          }

      - name: Sign and notarize macOS collector when credentials are configured
        if: matrix.name == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERTIFICATE_BASE64" ] || [ -z "$MACOS_CODESIGN_IDENTITY" ]; then
            echo "No macOS signing certificate configured. Applying ad-hoc signature for internal builds."
            SIGN_TARGET="dist/${{ matrix.artifact }}"
            if [ -d "dist/${{ matrix.artifact }}.app" ]; then
              SIGN_TARGET="dist/${{ matrix.artifact }}.app"
            fi
            codesign --force --deep --sign - "$SIGN_TARGET"
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/spacefoot-codesign.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/spacefoot-build.keychain-db"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          SIGN_TARGET="dist/${{ matrix.artifact }}"
          if [ -d "dist/${{ matrix.artifact }}.app" ]; then
            SIGN_TARGET="dist/${{ matrix.artifact }}.app"
          fi
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "$SIGN_TARGET"
          if [ -n "$MACOS_NOTARY_APPLE_ID" ] && [ -n "$MACOS_NOTARY_PASSWORD" ] && [ -n "$MACOS_NOTARY_TEAM_ID" ]; then
            ditto -c -k --keepParent "$SIGN_TARGET" "dist/${{ matrix.artifact }}.zip"
            xcrun notarytool submit "dist/${{ matrix.artifact }}.zip" --apple-id "$MACOS_NOTARY_APPLE_ID" --password "$MACOS_NOTARY_PASSWORD" --team-id "$MACOS_NOTARY_TEAM_ID" --wait
            xcrun stapler staple "$SIGN_TARGET"
            spctl --assess --type execute "$SIGN_TARGET"
          fi

      - name: Package macOS app
        if: matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "dist/${{ matrix.artifact }}.app" ]; then
            echo "No macOS .app bundle found to package."
            exit 0
          fi
          version="${GITHUB_REF_NAME#collector-manual-v}"
          version="${version#collector-v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="0.0.0-dev"
          fi
          chmod +x "dist/${{ matrix.artifact }}.app/Contents/MacOS/"*
          staging="$RUNNER_TEMP/spacefoot-macos-package"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp -R "dist/${{ matrix.artifact }}.app" "$staging/${{ matrix.artifact }}-${version}.app"
          ditto -c -k --sequesterRsrc --keepParent "$staging/${{ matrix.artifact }}-${version}.app" "dist/${{ matrix.artifact }}-${version}.app.zip"

      - name: Build Linux deb package
        if: matrix.name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#collector-manual-v}"
          version="${version#collector-v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="0.0.0-dev"
          fi
          package_root="dist/deb/spacefoot-it-collector"
          install_root="$package_root/opt/spacefoot-it-collector"
          mkdir -p "$package_root/DEBIAN" "$install_root" "$package_root/usr/share/applications" "$package_root/usr/share/icons/hicolor/256x256/apps"
          cp "dist/${{ matrix.artifact }}" "$install_root/spacefoot-it-collector"
          chmod 755 "$install_root/spacefoot-it-collector"
          cp frontend/assets/brand/app-icon.png "$package_root/usr/share/icons/hicolor/256x256/apps/spacefoot-it-collector.png"
          cat > "$package_root/DEBIAN/control" <<EOF
          Package: spacefoot-it-collector
          Version: $version
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Spacefoot IT <it@spacefoot.com>
          Depends: libc6 (>= 2.35), libx11-6, libxext6, libxrender1, libxft2, libfontconfig1, xdg-utils
          Description: Parcéo IT inventory collector
           Native collector for Parcéo inventory. It bundles the collector app and osquery runtime used for local hardware inventory.
          EOF
          sed -i 's/^          //' "$package_root/DEBIAN/control"
          cat > "$package_root/usr/share/applications/spacefoot-it-collector.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Parcéo Collector
          Comment=Parcéo hardware inventory collector
          Exec=/opt/spacefoot-it-collector/spacefoot-it-collector %u
          Icon=spacefoot-it-collector
          Terminal=false
          Categories=Utility;
          MimeType=x-scheme-handler/spacefoot-collector;
          EOF
          sed -i 's/^          //' "$package_root/usr/share/applications/spacefoot-it-collector.desktop"
          cat > "$package_root/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if command -v xdg-mime >/dev/null 2>&1; then
            xdg-mime default spacefoot-it-collector.desktop x-scheme-handler/spacefoot-collector || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database /usr/share/applications || true
          fi
          exit 0
          EOF
          sed -i 's/^          //' "$package_root/DEBIAN/postinst"
          chmod 755 "$package_root/DEBIAN/postinst"
          dpkg-deb --build "$package_root" "dist/spacefoot-it-collector-linux-${version}.deb"

      - name: Smoke test installed Linux package without scanning
        if: matrix.name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/spacefoot-it-collector-linux-*.deb
          installed="$(dpkg-query -W -f='${Version}' spacefoot-it-collector)"
          actual="$(/opt/spacefoot-it-collector/spacefoot-it-collector --version)"
          if [[ "$GITHUB_REF_NAME" == collector-v* || "$GITHUB_REF_NAME" == collector-manual-v* ]]; then
            expected="${GITHUB_REF_NAME#collector-manual-v}"
            expected="${expected#collector-v}"
            test "$installed" = "$expected"
            test "$actual" = "$installed"
          fi
          SPACEFOOT_COLLECTOR_STARTUP_PROBE=1 xvfb-run -a /opt/spacefoot-it-collector/spacefoot-it-collector
          test -f /usr/share/applications/spacefoot-it-collector.desktop

      - name: Upload collector artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}*
            dist/*.deb
            dist/*.cer
            dist/installer/*

  release:
    permissions:
      contents: write
    environment: production
    name: Publish collector release
    if: startsWith(github.ref, 'refs/tags/collector-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          pattern: spacefoot-it-collector-*
          merge-multiple: true

      - name: Prepare release assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release-upload
          find release-assets -type f \( \
            -name "Spacefoot-IT-Collector-*-Setup.exe" -o \
            -name "spacefoot-it-collector-linux-*.deb" -o \
            -name "spacefoot-it-collector-macos.app.zip" -o \
            -name "spacefoot-it-collector-macos-*.app.zip" -o \
            -name "*.cer" \
          \) -exec cp {} release-upload/ \;
          find release-assets -type f -path "*.app/Contents/MacOS/*" -exec chmod 755 {} \;
          if ! compgen -G "release-upload/spacefoot-it-collector-macos-*.app.zip" >/dev/null; then
            find release-assets -maxdepth 1 -type d -name "*.app" -print0 | while IFS= read -r -d '' app; do
              name="$(basename "$app")"
              (cd "$(dirname "$app")" && zip -qry "$GITHUB_WORKSPACE/release-upload/${name}.zip" "$name")
            done
          fi
          version="${TAG_NAME#collector-v}"
          if [ -f "release-upload/Spacefoot-IT-Collector-${version}-Setup.exe" ]; then
            mv "release-upload/Spacefoot-IT-Collector-${version}-Setup.exe" "release-upload/spacefoot-it-collector-windows-${version}-setup.exe"
          fi
          if [ -f release-upload/spacefoot-it-collector-macos.app.zip ]; then
            mv release-upload/spacefoot-it-collector-macos.app.zip "release-upload/spacefoot-it-collector-macos-${version}.app.zip"
          fi
          (cd release-upload && sha256sum * > SHA256SUMS.txt)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Sign release metadata
        env:
          COLLECTOR_UPDATE_PRIVATE_KEY: ${{ secrets.COLLECTOR_UPDATE_PRIVATE_KEY }}
          COLLECTOR_UPDATE_PUBLIC_KEY: ${{ vars.COLLECTOR_UPDATE_PUBLIC_KEY }}
          WINDOWS_PUBLISHER_THUMBPRINT: ${{ vars.WINDOWS_PUBLISHER_THUMBPRINT }}
        run: |
          python -m pip install --require-hashes -r collectors/requirements-build.lock
          python scripts/prepare-collector-release.py sign
          (cd release-upload && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$TAG_NAME" release-upload/* --latest \
            --repo "$REPOSITORY" \
            --title "Parcéo Collector $TAG_NAME" \
            --notes "Native collector builds for Windows, macOS and Linux. Windows ships as a setup executable. Linux ships as a .deb that installs Parcéo Collector, registers the spacefoot-collector:// protocol, and bundles osquery for local inventory. If osquery is unavailable at runtime, the collector falls back to its built-in Python inventory path instead of blocking the user. Verify downloads with SHA256SUMS.txt. Production artifacts require verified Windows signatures and macOS notarization. Automatic updates require the separately signed collector-releases.signed.json envelope."

  release-manual:
    name: Publish manual unsigned collector
    if: startsWith(github.ref, 'refs/tags/collector-manual-v')
    needs: [build, source]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
      - name: Verify and prepare manual downloads
        run: python scripts/prepare-manual-release.py
      - name: Publish explicitly unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-upload/* --prerelease --latest=false \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Parcéo Collector 0.1.54 — Sillage, téléchargement manuel non signé" \
            --notes-file docs/collector/manual-release.md
