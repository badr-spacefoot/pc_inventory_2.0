name: Build collector apps

on:
  workflow_dispatch:
    inputs:
      osquery_msi_url:
        description: "Optional direct download URL for the osquery Windows MSI bundled into the Spacefoot installer."
        required: false
        type: string
  push:
    tags:
      - "collector-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            artifact: spacefoot-it-collector-windows
            separator: ;
            pyinstaller_mode: --onedir
            pyinstaller_icon: --icon frontend/assets/brand/app-icon.ico
            pyinstaller_bundle_id: ""
          - name: macos
            os: macos-latest
            artifact: spacefoot-it-collector-macos
            separator: ":"
            pyinstaller_mode: --onefile
            pyinstaller_icon: --icon build/app-icon.icns
            pyinstaller_bundle_id: "--osx-bundle-identifier com.spacefoot.itcollector"
          - name: linux
            os: ubuntu-latest
            artifact: spacefoot-it-collector-linux
            separator: ":"
            pyinstaller_mode: --onefile
            pyinstaller_icon: ""
            pyinstaller_bundle_id: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Prepare bundled tools directory
        shell: bash
        run: mkdir -p installer-assets/bundled-tools

      - name: Bundle osquery for Linux
        if: matrix.name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL -H "User-Agent: spacefoot-it-collector-build" https://api.github.com/repos/osquery/osquery/releases/latest)"
          osquery_deb_url="$(python -c 'import json,sys; data=json.load(sys.stdin); assets=data.get("assets", []); urls=[a.get("browser_download_url", "") for a in assets if a.get("name", "").endswith(".deb") and ("amd64" in a.get("name", "").lower() or "x86_64" in a.get("name", "").lower()) and "dbgsym" not in a.get("name", "").lower()]; print(urls[0] if urls else "")' <<< "$release_json")"
          if [ -z "$osquery_deb_url" ]; then
            echo "No Linux amd64 osquery .deb asset was found in the latest osquery release."
            exit 1
          fi
          echo "Using osquery package: $osquery_deb_url"
          curl -fsSL "$osquery_deb_url" -o installer-assets/osquery.deb
          mkdir -p installer-assets/osquery-root
          dpkg-deb -x installer-assets/osquery.deb installer-assets/osquery-root
          osqueryi_path="$(find installer-assets/osquery-root -name osqueryi | head -n 1)"
          if [ -z "$osqueryi_path" ]; then
            echo "osqueryi was not found inside the downloaded osquery package."
            exit 1
          fi
          if [ -d installer-assets/osquery-root/opt/osquery ]; then
            cp -a installer-assets/osquery-root/opt/osquery installer-assets/bundled-tools/osquery
            find installer-assets/bundled-tools/osquery -name osqueryi -exec chmod +x {} \;
          else
            cp "$osqueryi_path" installer-assets/bundled-tools/osqueryi
            chmod +x installer-assets/bundled-tools/osqueryi
          fi
          cp -L "$osqueryi_path" installer-assets/bundled-tools/osqueryi
          chmod +x installer-assets/bundled-tools/osqueryi

      - name: Prepare macOS app icon
        if: matrix.name == 'macos'
        shell: bash
        run: |
          mkdir -p build/app-icon.iconset
          sips -z 16 16 frontend/assets/brand/app-icon.png --out build/app-icon.iconset/icon_16x16.png
          sips -z 32 32 frontend/assets/brand/app-icon.png --out build/app-icon.iconset/icon_16x16@2x.png
          sips -z 32 32 frontend/assets/brand/app-icon.png --out build/app-icon.iconset/icon_32x32.png
          sips -z 64 64 frontend/assets/brand/app-icon.png --out build/app-icon.iconset/icon_32x32@2x.png
          sips -z 128 128 frontend/assets/brand/app-icon.png --out build/app-icon.iconset/icon_128x128.png
          sips -z 256 256 frontend/assets/brand/app-icon.png --out build/app-icon.iconset/icon_128x128@2x.png
          sips -z 256 256 frontend/assets/brand/app-icon.png --out build/app-icon.iconset/icon_256x256.png
          sips -z 512 512 frontend/assets/brand/app-icon.png --out build/app-icon.iconset/icon_256x256@2x.png
          sips -z 512 512 frontend/assets/brand/app-icon.png --out build/app-icon.iconset/icon_512x512.png
          sips -z 1024 1024 frontend/assets/brand/app-icon.png --out build/app-icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/app-icon.iconset -o build/app-icon.icns

      - name: Build collector
        run: >
          pyinstaller
          ${{ matrix.pyinstaller_mode }}
          --windowed
          --name "${{ matrix.artifact }}"
          ${{ matrix.pyinstaller_icon }}
          ${{ matrix.pyinstaller_bundle_id }}
          --add-data "scripts/collect-cross-platform.py${{ matrix.separator }}scripts"
          --add-data "frontend/assets/brand/app-icon.png${{ matrix.separator }}assets/brand"
          --add-data "installer-assets/bundled-tools${{ matrix.separator }}bundled-tools"
          --hidden-import argparse
          --hidden-import ctypes
          --hidden-import datetime
          --hidden-import getpass
          --hidden-import os
          --hidden-import platform
          --hidden-import re
          --hidden-import shutil
          --hidden-import socket
          --hidden-import subprocess
          --hidden-import urllib.error
          --hidden-import urllib.request
          --hidden-import uuid
          --hidden-import winreg
          collectors/desktop_collector/collector_app.py

      - name: Register macOS URL scheme
        if: matrix.name == 'macos'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import plistlib

          plist_path = Path("dist/spacefoot-it-collector-macos.app/Contents/Info.plist")
          if not plist_path.exists():
              raise SystemExit(f"macOS app Info.plist not found: {plist_path}")

          with plist_path.open("rb") as handle:
              plist = plistlib.load(handle)

          plist["CFBundleIdentifier"] = "com.spacefoot.itcollector"
          plist["CFBundleName"] = "Spacefoot IT Collector"
          plist["CFBundleDisplayName"] = "Spacefoot IT Collector"
          plist["CFBundleURLTypes"] = [
              entry
              for entry in plist.get("CFBundleURLTypes", [])
              if "spacefoot-collector" not in entry.get("CFBundleURLSchemes", [])
          ]
          plist["CFBundleURLTypes"].append({
              "CFBundleTypeRole": "Viewer",
              "CFBundleURLName": "com.spacefoot.itcollector",
              "CFBundleURLSchemes": ["spacefoot-collector"],
          })

          with plist_path.open("wb") as handle:
              plistlib.dump(plist, handle)
          PY

      - name: Sign Windows collector
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $target = "dist/${{ matrix.artifact }}/${{ matrix.artifact }}.exe"
          if (-not (Test-Path $target)) {
            $target = "dist/${{ matrix.artifact }}.exe"
          }
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) {
            throw "signtool.exe not found in Windows SDK."
          }
          if ($env:WINDOWS_CODESIGN_PFX_BASE64) {
            $certPath = Join-Path $env:RUNNER_TEMP "spacefoot-codesign.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
            & $signTool sign /f $certPath /p $env:WINDOWS_CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $target
            exit $LASTEXITCODE
          }
          Write-Host "No official Windows signing certificate configured. Creating a self-signed internal testing certificate."
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Spacefoot IT Collector Internal Testing" `
            -FriendlyName "Spacefoot IT Collector Internal Testing" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(2)
          Export-Certificate -Cert $cert -FilePath "dist/spacefoot-it-collector-internal-test.cer" | Out-Null
          & $signTool sign /sha1 $cert.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $target
          exit $LASTEXITCODE

      - name: Download osquery Windows MSI
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          OSQUERY_MSI_URL: ${{ inputs.osquery_msi_url }}
        run: |
          New-Item -ItemType Directory -Force installer-assets | Out-Null
          if ($env:OSQUERY_MSI_URL) {
            $downloadUrl = $env:OSQUERY_MSI_URL
            Write-Host "Using workflow-provided osquery MSI URL."
          } else {
            $release = Invoke-RestMethod `
              -Headers @{ "User-Agent" = "spacefoot-it-collector-build" } `
              -Uri "https://api.github.com/repos/osquery/osquery/releases/latest"
            $asset = $release.assets |
              Where-Object { $_.name -match '\.msi$' -and $_.name -match 'osquery' } |
              Select-Object -First 1
            if (-not $asset) {
              throw "No osquery Windows MSI asset was found in the latest osquery release. Re-run with workflow_dispatch input osquery_msi_url."
            }
            $downloadUrl = $asset.browser_download_url
            Write-Host "Using osquery MSI asset: $($asset.name)"
          }
          Invoke-WebRequest -Uri $downloadUrl -OutFile "installer-assets/osquery.msi"

      - name: Install Inno Setup
        if: matrix.name == 'windows'
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -like "collector-v*") {
            $env:GITHUB_REF_NAME -replace '^collector-v', ''
          } else {
            "0.0.0-dev"
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc."
          }
          & $iscc "installer/windows/spacefoot-collector.iss" "/DAppVersion=$version"

      - name: Sign Windows installer
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $version = if ($env:GITHUB_REF_NAME -like "collector-v*") {
            $env:GITHUB_REF_NAME -replace '^collector-v', ''
          } else {
            "0.0.0-dev"
          }
          $target = "dist/installer/Spacefoot-IT-Collector-$version-Setup.exe"
          if (-not (Test-Path $target)) {
            throw "Installer was not found at $target."
          }
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) {
            throw "signtool.exe not found in Windows SDK."
          }
          if ($env:WINDOWS_CODESIGN_PFX_BASE64) {
            $certPath = Join-Path $env:RUNNER_TEMP "spacefoot-codesign.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
            & $signTool sign /f $certPath /p $env:WINDOWS_CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $target
            exit $LASTEXITCODE
          }
          $cert = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Subject -eq "CN=Spacefoot IT Collector Internal Testing" } |
            Select-Object -First 1
          if (-not $cert) {
            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=Spacefoot IT Collector Internal Testing" `
              -FriendlyName "Spacefoot IT Collector Internal Testing" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -KeyAlgorithm RSA `
              -KeyLength 3072 `
              -HashAlgorithm SHA256 `
              -NotAfter (Get-Date).AddYears(2)
          }
          New-Item -ItemType Directory -Force dist/installer | Out-Null
          Export-Certificate -Cert $cert -FilePath "dist/installer/spacefoot-it-collector-internal-test.cer" | Out-Null
          & $signTool sign /sha1 $cert.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $target
          exit $LASTEXITCODE

      - name: Sign and notarize macOS collector when credentials are configured
        if: matrix.name == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_BASE64" ] || [ -z "$MACOS_CODESIGN_IDENTITY" ]; then
            echo "No macOS signing certificate configured. Skipping signing."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/spacefoot-codesign.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/spacefoot-build.keychain-db"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          SIGN_TARGET="dist/${{ matrix.artifact }}"
          if [ -d "dist/${{ matrix.artifact }}.app" ]; then
            SIGN_TARGET="dist/${{ matrix.artifact }}.app"
          fi
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "$SIGN_TARGET"
          if [ -n "$MACOS_NOTARY_APPLE_ID" ] && [ -n "$MACOS_NOTARY_PASSWORD" ] && [ -n "$MACOS_NOTARY_TEAM_ID" ]; then
            ditto -c -k --keepParent "$SIGN_TARGET" "dist/${{ matrix.artifact }}.zip"
            xcrun notarytool submit "dist/${{ matrix.artifact }}.zip" --apple-id "$MACOS_NOTARY_APPLE_ID" --password "$MACOS_NOTARY_PASSWORD" --team-id "$MACOS_NOTARY_TEAM_ID" --wait
          fi

      - name: Package macOS app
        if: matrix.name == 'macos'
        shell: bash
        run: |
          if [ ! -d "dist/${{ matrix.artifact }}.app" ]; then
            echo "No macOS .app bundle found to package."
            exit 0
          fi
          chmod +x "dist/${{ matrix.artifact }}.app/Contents/MacOS/"*
          ditto -c -k --sequesterRsrc --keepParent "dist/${{ matrix.artifact }}.app" "dist/${{ matrix.artifact }}.app.zip"

      - name: Build Linux deb package
        if: matrix.name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#collector-v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="0.0.0-dev"
          fi
          package_root="dist/deb/spacefoot-it-collector"
          install_root="$package_root/opt/spacefoot-it-collector"
          mkdir -p "$package_root/DEBIAN" "$install_root" "$package_root/usr/share/applications" "$package_root/usr/share/icons/hicolor/256x256/apps"
          cp "dist/${{ matrix.artifact }}" "$install_root/spacefoot-it-collector"
          chmod 755 "$install_root/spacefoot-it-collector"
          cp frontend/assets/brand/app-icon.png "$package_root/usr/share/icons/hicolor/256x256/apps/spacefoot-it-collector.png"
          cat > "$package_root/DEBIAN/control" <<EOF
          Package: spacefoot-it-collector
          Version: $version
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Spacefoot IT <it@spacefoot.com>
          Depends: libc6, libx11-6, libxext6, libxrender1, libxft2, libfontconfig1, xdg-utils
          Description: Spacefoot IT inventory collector
           Native collector for Spacefoot IT inventory. It bundles the collector app and osquery runtime used for local hardware inventory.
          EOF
          sed -i 's/^          //' "$package_root/DEBIAN/control"
          cat > "$package_root/usr/share/applications/spacefoot-it-collector.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Spacefoot IT Collector
          Comment=Spacefoot hardware inventory collector
          Exec=/opt/spacefoot-it-collector/spacefoot-it-collector %u
          Icon=spacefoot-it-collector
          Terminal=false
          Categories=Utility;
          MimeType=x-scheme-handler/spacefoot-collector;
          EOF
          sed -i 's/^          //' "$package_root/usr/share/applications/spacefoot-it-collector.desktop"
          cat > "$package_root/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if command -v xdg-mime >/dev/null 2>&1; then
            xdg-mime default spacefoot-it-collector.desktop x-scheme-handler/spacefoot-collector || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database /usr/share/applications || true
          fi
          exit 0
          EOF
          sed -i 's/^          //' "$package_root/DEBIAN/postinst"
          chmod 755 "$package_root/DEBIAN/postinst"
          dpkg-deb --build "$package_root" "dist/spacefoot-it-collector-linux-${version}.deb"

      - name: Upload collector artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}*
            dist/*.deb
            dist/*.cer
            dist/installer/*

  release:
    name: Publish collector release
    if: startsWith(github.ref, 'refs/tags/collector-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release-upload
          find release-assets -type f \( \
            -name "Spacefoot-IT-Collector-*-Setup.exe" -o \
            -name "spacefoot-it-collector-linux" -o \
            -name "spacefoot-it-collector-linux-*.deb" -o \
            -name "spacefoot-it-collector-macos" -o \
            -name "spacefoot-it-collector-macos.app.zip" -o \
            -name "*.cer" \
          \) -exec cp {} release-upload/ \;
          find release-assets -type f -path "*.app/Contents/MacOS/*" -exec chmod 755 {} \;
          find release-assets -maxdepth 1 -type d -name "*.app" -print0 | while IFS= read -r -d '' app; do
            name="$(basename "$app")"
            (cd "$(dirname "$app")" && zip -qry "$GITHUB_WORKSPACE/release-upload/${name}.zip" "$name")
          done
          version="${TAG_NAME#collector-v}"
          if [ -f "release-upload/Spacefoot-IT-Collector-${version}-Setup.exe" ]; then
            mv "release-upload/Spacefoot-IT-Collector-${version}-Setup.exe" "release-upload/spacefoot-it-collector-windows-${version}-setup.exe"
          fi
          if [ -f release-upload/spacefoot-it-collector-linux ]; then
            mv release-upload/spacefoot-it-collector-linux "release-upload/spacefoot-it-collector-linux-${version}"
          fi
          if [ -f release-upload/spacefoot-it-collector-macos ]; then
            mv release-upload/spacefoot-it-collector-macos "release-upload/spacefoot-it-collector-macos-${version}"
          fi
          if [ -f release-upload/spacefoot-it-collector-macos.app.zip ]; then
            mv release-upload/spacefoot-it-collector-macos.app.zip "release-upload/spacefoot-it-collector-macos-${version}.app.zip"
          fi
          (cd release-upload && sha256sum * > SHA256SUMS.txt)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$TAG_NAME" release-upload/* \
            --repo "$REPOSITORY" \
            --title "Spacefoot IT Collector $TAG_NAME" \
            --notes "Native collector builds for Windows, macOS and Linux. Windows ships as a setup executable. Linux ships as a .deb that installs Spacefoot IT Collector, registers the spacefoot-collector:// protocol, and bundles osquery for local inventory. If osquery is unavailable at runtime, the collector falls back to its built-in Python inventory path instead of blocking the user. Verify downloads with SHA256SUMS.txt. Windows builds use an internal self-signed testing certificate when no official code-signing certificate is configured. Sign Windows with a trusted certificate and notarize macOS before broad distribution."
