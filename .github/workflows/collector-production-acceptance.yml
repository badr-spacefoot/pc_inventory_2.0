name: Collector production acceptance (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorized-vm:
    if: github.ref == 'refs/heads/main'
    environment: production
    name: Authorized production test / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            invitation: COLLECTOR_VM_INVITE_LINUX
          - name: macOS Intel
            os: macos-15-intel
            invitation: COLLECTOR_VM_INVITE_MAC_INTEL
          - name: macOS Apple Silicon
            os: macos-15
            invitation: COLLECTOR_VM_INVITE_MAC_ARM
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Prepare Linux GUI and verified osquery
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick tesseract-ocr
          python scripts/download-osquery.py linux
          dpkg-deb -x installer-assets/osquery.deb "$RUNNER_TEMP/acceptance-osquery"
      - name: Send the explicitly authorized VM inventory
        env:
          PARCEO_ACCEPTANCE_ROOT: ${{ runner.temp }}/parceo-release-acceptance
          PARCEO_ACCEPTANCE_PRODUCTION: "1"
          PARCEO_PRODUCTION_INVITE: ${{ secrets[matrix.invitation] }}
        shell: bash
        run: |
          test -n "$PARCEO_PRODUCTION_INVITE" || { echo "A dedicated authorized invitation is required"; exit 1; }
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1600x1200x24' python tools/collector-binary-acceptance.py
          else
            python tools/collector-binary-acceptance.py
          fi
      - name: Keep sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collector-production-acceptance-${{ strategy.job-index }}
          path: ${{ runner.temp }}/parceo-release-acceptance/result.json
          if-no-files-found: warn
          retention-days: 14
