name: Verify Spacefoot migration access (read only)
on:
  push:
    branches: [codex/parceo-vercel-migration]
    paths: [.github/workflows/migration-verify.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify existing project access without changing production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          assert token, 'SUPABASE_ACCESS_TOKEN is unavailable'
          def get(path):
              request = urllib.request.Request('https://api.supabase.com/v1/' + path, headers={'Authorization': 'Bearer ' + token})
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit('Management API access failed: HTTP ' + str(error.code)) from None
          project = get('projects/oletfrcaptvardmdwacy')
          assert project['id'] == 'oletfrcaptvardmdwacy'
          assert project['organization_id'] == 'zqejjzdnqjgolttdiizx'
          assert project['status'] == 'ACTIVE_HEALTHY'
          functions = get('projects/oletfrcaptvardmdwacy/functions')
          api = next(item for item in functions if item['slug'] == 'inventory-api')
          assert api['status'] == 'ACTIVE'
          assert api['version'] == 309
          print('Existing GitHub token retains project access; Spacefoot organization, health and API version verified. No writes performed.')
          PY
