name: Collector macOS Gatekeeper acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/collector-gatekeeper-acceptance.yml
      - tools/collector-gatekeeper-acceptance.py

permissions:
  contents: read

jobs:
  gatekeeper:
    name: Gatekeeper 0.1.58 / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Download with Safari and attempt a protected LaunchServices open
        env:
          PARCEO_ACCEPTANCE_ROOT: ${{ runner.temp }}/parceo-gatekeeper-acceptance
        run: python tools/collector-gatekeeper-acceptance.py
      - name: Keep Gatekeeper evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collector-gatekeeper-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/parceo-gatekeeper-acceptance/result.json
            ${{ runner.temp }}/parceo-gatekeeper-acceptance/launch-result.png
          if-no-files-found: warn
          retention-days: 14
