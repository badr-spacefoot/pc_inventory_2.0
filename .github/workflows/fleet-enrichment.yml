name: Refresh fleet prices and valuation

on:
  schedule:
    - cron: "35 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Refresh external prices and fleet valuation
        env:
          API_URL: ${{ vars.IT_INVENTORY_API_URL }}
          SYNC_TOKEN: ${{ secrets.ENRICHMENT_SYNC_TOKEN }}
        shell: bash
        run: |
          test -n "$API_URL" || { echo "Missing repository variable IT_INVENTORY_API_URL"; exit 1; }
          test -n "$SYNC_TOKEN" || { echo "Missing repository secret ENRICHMENT_SYNC_TOKEN"; exit 1; }

          headers=(
            --header "content-type: application/json"
            --header "x-enrichment-sync-token: $SYNC_TOKEN"
          )
          start=$(curl --fail-with-body --show-error --silent \
            --retry 2 --retry-delay 5 --max-time 120 \
            --request POST "$API_URL/admin/enrichment-jobs" \
            "${headers[@]}" \
            --data '{"mode":"refresh","force":true,"useExternal":true}')
          job_id=$(jq -r '.job.id // empty' <<<"$start")
          test -n "$job_id" || { echo "The API did not return an enrichment job id"; exit 1; }

          status="running"
          for attempt in $(seq 1 40); do
            response=$(curl --fail-with-body --show-error --silent \
              --retry 2 --retry-delay 5 --max-time 180 \
              --request POST "$API_URL/admin/enrichment-jobs/process" \
              "${headers[@]}" \
              --data "{\"jobId\":\"$job_id\",\"limit\":5}")
            status=$(jq -r '.job.status // "unknown"' <<<"$response")
            processed=$(jq -r '.job.processedCount // 0' <<<"$response")
            total=$(jq -r '.job.totalCount // 0' <<<"$response")
            echo "Fleet enrichment: $processed/$total ($status)"
            if [ "$status" = "completed" ]; then
              break
            fi
            if [ "$status" = "failed" ]; then
              jq . <<<"$response"
              exit 1
            fi
            sleep 2
          done

          test "$status" = "completed" || {
            echo "Fleet enrichment did not complete within the batch limit"
            exit 1
          }
